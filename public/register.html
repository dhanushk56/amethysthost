<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create your account</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<nav class="nav">
  <div class="wrap">
    <a href="/" class="brand"><span class="dot"></span> AmethystHost</a>
    <div></div>
    <div class="nav-cta"><a href="/login.html" class="btn btn-ghost">Log in</a></div>
  </div>
</nav>

<div class="auth-wrap">
  <div class="auth-card">
    <h1>Create your account</h1>
    <p class="sub">No credit card needed to start your free server.</p>
    <div class="form-error" id="formError"></div>
    <form id="registerForm">
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" required autocomplete="name" />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required minlength="8" autocomplete="new-password" />
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Create account</button>
    </form>
    <p class="form-note">Already have an account? <a href="/login.html">Log in</a></p>
  </div>
</div>

<script src="js/auth.js"></script>
</body>
</html>
