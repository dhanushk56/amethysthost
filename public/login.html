<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in — ForgeHost</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<nav class="nav">
  <div class="wrap">
    <a href="/" class="brand"><span class="dot"></span> ForgeHost</a>
    <div></div>
    <div class="nav-cta"><a href="/register.html" class="btn btn-ghost">Create account</a></div>
  </div>
</nav>

<div class="auth-wrap">
  <div class="auth-card">
    <h1>Welcome back</h1>
    <p class="sub">Log in to manage your servers.</p>
    <div class="form-error" id="formError"></div>
    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Log in</button>
    </form>
    <p class="form-note">No account yet? <a href="/register.html">Start free</a></p>
  </div>
</div>

<script src="js/auth.js"></script>
</body>
</html>
